name: Focused PR integration comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-pr-integration-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'goldinbidsheets-rgb/paperclip' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [upstream, merged]
        case: [browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paperclipai/paperclip
          ref: ${{ matrix.source == 'upstream' && 'e00d10d5d5594f6e2d1e8cf4e0ec81c074b0bd88' || 'd93b72fd9d86b4b416c6865534ff5c4a7b28784c' }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Capture source and frozen dependency pins
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../receipts
          git show -s --format='%H%n%T%n%P' HEAD | tee ../receipts/source.txt
          if [ '${{ matrix.source }}' = merged ]; then
            test "$(git rev-parse 'HEAD^{tree}')" = 3d2dfa11f3528a4a9364d19a23e1a290f3f78216
          fi
          sha256sum pnpm-lock.yaml packages/paperclip-runner/runner/Cargo.lock > ../receipts/dependency-hashes.txt
          cp pnpm-lock.yaml ../receipts/pnpm-lock.yaml
          cp packages/paperclip-runner/runner/Cargo.lock ../receipts/Cargo.lock
          node --version > ../receipts/node-version.txt
          pnpm --version > ../receipts/pnpm-version.txt
          uname -a > ../receipts/platform.txt
          pnpm install --frozen-lockfile 2>&1 | tee ../receipts/install.log
          pnpm list --depth 0 --json > ../receipts/dependencies.json
          git diff --exit-code -- pnpm-lock.yaml
      - name: Add observation-only fixture capture
        shell: bash
        run: |
          python3 diagnostic/diagnostics/pr-integration/instrument.py target '${{ matrix.case }}'
          git -C target diff > receipts/instrumentation.patch
      - name: Prepare runner dependencies
        if: matrix.case == 'runner'
        working-directory: target/packages/paperclip-runner
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustc --version > ../../../receipts/rust-version.txt
          cc --version > ../../../receipts/cc-version.txt
          pnpm run ensure:eval-build-deps 2>&1 | tee ../../../receipts/eval-build.log
          pnpm run build:rust 2>&1 | tee ../../../receipts/rust-build.log
      - name: Exact runner test
        if: matrix.case == 'runner'
        working-directory: target/packages/paperclip-runner
        env:
          DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/receipts/runner-state
        shell: bash
        run: |
          set +e
          pnpm exec vitest run src/live/runnerd-codex-transport.test.ts -t '^preserves prepared input through runnerd and the real OpenCode proxy boundary$' --reporter=verbose --reporter=json --outputFile.json=../../../receipts/runner-tests.json 2>&1 | tee ../../../receipts/runner.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > ../../../receipts/test-exit.txt
          exit "$result"
      - name: Exact signoff browser test
        if: matrix.case == 'browser'
        working-directory: target
        env:
          DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/receipts/signoff
          PAPERCLIP_E2E_SKIP_LLM: 'true'
          PAPERCLIP_PLAYWRIGHT_CHANNEL: chrome
          PAPERCLIP_TELEMETRY_DISABLED: '1'
          CI: 'true'
        shell: bash
        run: |
          google-chrome --version > ../receipts/chrome-version.txt
          set +e
          pnpm run test:e2e tests/e2e/signoff-policy.spec.ts --grep 'review-only policy: reviewer approval completes execution$' 2>&1 | tee ../receipts/browser.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > ../receipts/test-exit.txt
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: comparison-${{ matrix.source }}-${{ matrix.case }}
          path: |
            receipts/
            target/tests/e2e/playwright-report/
            target/tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: error
