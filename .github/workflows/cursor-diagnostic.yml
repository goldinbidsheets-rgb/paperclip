name: Cursor fixture fixed-pin diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision:
          - 86be22974dec93eb84654dcddcc3a395e8017598
          - b31558064093564fb937cf046596d1d497f5be27
    steps:
      # CEO places this reviewed public-only package under diagnostics/cursor/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: diagnostic-package
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paperclipai/paperclip
          ref: ${{ matrix.revision }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Bounded negative control and candidate adapter tests
        id: diagnostic
        working-directory: source
        run: bash ../diagnostic-package/diagnostics/cursor/run-diagnostic.sh
      - name: Capture original exit files and logs
        if: always() && steps.diagnostic.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cursor-${{ matrix.revision }}
          path: ${{ steps.diagnostic.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
